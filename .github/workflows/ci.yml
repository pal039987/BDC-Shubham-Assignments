name: ShopSphere Agent CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-eval-gate:
    name: Lint, Test, Eval Gate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linting (flake8)
        run: |
          make lint

      - name: Run Guardrail & Tool Unit Tests
        run: |
          make test

      - name: Run Quality Eval Gate (Offline Replay)
        run: |
          make eval

      - name: Build Docker Container (shopsphere-agent:v1)
        run: |
          make docker-build
