<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VTrade</title>
  <meta name="description" content="VTrade – Professional Crypto Trading" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- High Refresh Rate & Hardware Acceleration Meta -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="lightweight-charts.js"></script>
  <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

  <!-- Root App Viewport (120 FPS Hardware Accelerated Clean Slate) -->
  <div id="app" class="vtrade-app-root">
    <!-- Clean Slate Ready for New UI Layout from Screenshots -->
    <div id="vtrade-main-viewport" class="vtrade-main-viewport">
      <div class="clean-slate-container">
        <div class="cs-logo">⚡ VTRADE</div>
        <div class="cs-status-badge">120 FPS ENGINE READY</div>
        <p class="cs-text">Previous UI completely cleared. Awaiting new design screenshots to construct exact layout step-by-step.</p>
        <div class="cs-spinner"></div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Layer -->
  <div id="toast-container" class="toast-container"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
