services:
  agent:
    build:
      context: ./shopsphere-agent
      dockerfile: Dockerfile
    image: shopsphere-agent:${AGENT_VERSION:-v2}
    container_name: shopsphere-agent
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AUTO_REFUND_ENABLED=${AUTO_REFUND_ENABLED:-true}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - AGENT_VERSION=${AGENT_VERSION:-v2}
      - PROMPT_VERSION=${PROMPT_VERSION:-v2}
      - DB_PATH=/data/shopsphere.db
      - DATA_DIR=/app/shopsphere_data
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:4318
      - TRACING_ENABLED=true
    volumes:
      - shopsphere_db_volume:/data
    depends_on:
      phoenix:
        condition: service_started
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: shopsphere-phoenix
    ports:
      - "6006:6006" # Web UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - PHOENIX_PORT=6006
      - PHOENIX_GRPC_PORT=4317
    restart: unless-stopped

volumes:
  shopsphere_db_volume:
    name: shopsphere_db_volume
